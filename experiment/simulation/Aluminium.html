    <script>
        // 1. Ticker Logic
        const msg = "Virtual Lab - Dayalbagh Educational Institute ";
        let pos = 0;
        function scrollTitle() {
            document.getElementById('scrolling-ticker').innerText = msg.substring(pos, msg.length) + msg.substring(0, pos);
            pos++;
            if (pos > msg.length) pos = 0;
            setTimeout(scrollTitle, 200);
        }
        scrollTitle();

        // 2. The Logic Mapper (The "One Liner" Brain)
        // Format Key: ExtrusionType_Angle_Radius_Friction_Speed_Temperature
        // Mapping: Key => { path: string, desc: string }
        const db = {
            // Helper to generate path prefix
            getPath: (type, temp, radius, angle) => 
                `EXTRUSION/Al_Extrusion/al_${temp.toLowerCase()}_${type.toLowerCase()}_${radius === '1' ? 'r' + angle : angle}/`,
            
            // Helper to generate filename codes based on PHP logic inconsistencies
            getFile: (type, angle, radius, fr, speed, temp) => {
                const fCode = fr === '0' ? 'F0' : (fr === 'Medium' ? 'FM' : 'FH');
                const vCode = `V${speed}`;
                const tCode = temp.toUpperCase();
                
                // Logic derived from PHP patterns
                if (type === 'Pipe') {
                    if (temp === 'Cold') {
                        if (radius === '1') {
                            // Cold Pipe With Curvature
                            const angleStr = angle === '60' ? '60' : `_${angle}`; // PHP inconsistency: AL60 vs AL_45
                            return `EX_AL${angleStr}_R5_MAN_${fCode}_${vCode}.mp4`;
                        } else {
                            // Cold Pipe No Curvature
                            return `EX_PIPE_${angle}_COLD_${vCode}_${fCode}.mp4`; // Note: V comes before F here usually
                        }
                    } else { // Hot
                        if (radius === '1') {
                             // Hot Pipe With Curvature
                            return `EX_PIPE_AL_${angle}_HOT_R5_MAN_${fCode}_${vCode}.mp4`; // Note F before V usually here in Hot
                             // Exception handling for 60 deg hot pipe r5 based on PHP
                             if(angle === '60' && fCode === 'F0') return `EX_PIPE_AL_60_HOT_R5_F0_${vCode}.mp4`; // Missing MAN
                        } else {
                             // Hot Pipe No Curvature
                            return `EX_PIPE_AL_${angle}_HOT_${vCode}_${fCode}.mp4`;
                        }
                    }
                } else { // Solid
                    if (temp === 'Cold') {
                        if (radius === '1') return `EX_AL_${angle}_R5_${fCode}_${vCode}.mp4`;
                        else return `EX_SOLID_${angle}_COLD_${vCode}_${fCode}.mp4`;
                    } else { // Hot
                        if (radius === '1') return `EX_SOLID_AL_${angle}_HOT_R5_${vCode}_${fCode}.mp4`;
                        else return `EX_AL_SOLID_${angle}_HOT_${vCode}_${fCode}.mp4`; // Note: EX_AL_SOLID naming
                        // Exception for 60 deg hot solid no curve
                        if(angle === '60' && radius === '0') return `EX_SOLID_AL_60_HOT_${vCode}_${fCode}.mp4`; 
                    }
                }
            }
        };

        // 3. Text Generator (Replaces the massive repetitive strings)
        function generateDescription(p) {
            const isHot = p.mw === 'Hot';
            const isPipe = p.ext === 'Pipe';
            const fText = p.fr === '0' ? 'no' : p.fr.toLowerCase();
            const curvature = p.radius === '1' ? 'with the radius of 5mm' : '';
            
            let base = `In this video you can see the ${isHot ? 'hot' : ''} extrusion process of Aluminium ${isPipe ? 'pipe which comprises of a mandrel in the extrusion die' : 'solid shaft with 50% reduction in diameter of the billet'}. This process is ${isHot ? 'hot' : 'cold'} extrusion process where different parameters are controlled on the basis of given specifications. `;
            
            base += `Extrusion forces with respect to pilot height are shown over the graph these Forces are maximum when there is sudden change in area of cross section of the billet. As the pilot height reduces the force required to extrusion of ${p.ext.toLowerCase()} is increases. `;
            
            if (isHot) base += `Maximum force required during hot extrusion process is less than cold extrusion process. `;
            
            base += `Ram velocity is set as ${p.speed}mm per sec ${curvature}. Die angle is specified as ${p.angle}<sup>o</sup> and it is specified that there is ${fText} friction during this ${isHot ? 'hot' : 'cold'} extrusion process. `;
            
            // Add specific temperature observations based on logic
            if ((p.mw === 'Cold' && p.fr !== 'Medium') || (p.mw === 'Hot' && p.fr === '0') || (p.mw === 'Hot' && p.fr === 'Medium' && p.angle !== '90')) {
                base += `Left side coloured strip shows temperature variation in the billet. The red region shows the maximum temperature generated at varying cross section.`;
            } else if (p.mw === 'Cold' && p.fr === 'High' && p.radius === '0') {
                 base += `Left side coloured strip shows Equivalent strain in the billet.`;
            }
            
            if (!isPipe) base += ` One fourth of the solid shaft is shown over the screen because this solid shaft is axis symmetric with X and Y direction.`;

            return base;
        }

        // 4. Form Handler
        document.getElementById('simForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Collect Form Data into a neat object
            const fd = new FormData(e.target);
            const params = {
                ext: fd.get('ext'),
                angle: fd.get('angle'),
                radius: fd.get('radius'),
                fr: fd.get('fr'),
                speed: fd.get('speed'),
                mw: fd.get('mw')
            };

            // Calculate Path using the Helper Logic
            // Note: Manual overrides for specific messy filenames from the original PHP
            // We use the helper logic defined in DB to generate the string pattern
            
            const folder = db.getPath(params.ext, params.mw, params.radius, params.angle);
            const file = db.getFile(params.ext, params.angle, params.radius, params.fr, params.speed, params.mw);
            
            // Specific overrides for filenames that broke the pattern in the original PHP
            // (e.g., EX_AL60 vs EX_AL_60 or missing MAN tags)
            let finalPath = folder + file;

            // --- CORRECTION BLOCK FOR PHP INCONSISTENCIES ---
            // The original PHP had typos/inconsistencies in filenames. 
            // This block maps specific generated paths to the exact PHP strings where they deviated wildly.
            if(params.ext==='Pipe' && params.mw==='Cold' && params.radius==='1' && params.angle==='60') finalPath = folder + `EX_AL60_R5_MAN_${params.fr==='0'?'F0':(params.fr==='Medium'?'FM':'FH')}_V${params.speed}.mp4`;
            if(params.ext==='Pipe' && params.mw==='Cold' && params.radius==='0' && params.angle==='90') finalPath = folder + `AL_PIPE_90_V${params.speed}_COLD_${params.fr==='0'?'F0':(params.fr==='Medium'?'FM':'FH')}.mp4`;
            if(params.ext==='Pipe' && params.mw==='Hot' && params.radius==='1' && params.angle==='90') finalPath = folder + `EX_PIPE_AL_90_HOT_R5_MAN_${params.fr==='0'?'F0':(params.fr==='Medium'?'FM':'FH')}_V${params.speed}.mp4`;
            
            // Update UI
            const resultArea = document.getElementById('resultArea');
            const videoPlayer = document.getElementById('simVideo');
            const descText = document.getElementById('simText');

            resultArea.classList.remove('hidden');
            
            // Set Video
            videoPlayer.src = finalPath;
            videoPlayer.load();
            videoPlayer.play();

            // Set Text
            descText.innerHTML = generateDescription(params);
            
            // Scroll to results
            resultArea.scrollIntoView({ behavior: 'smooth' });
        });
    </script>

            };

            // Validate all fields are selected
            if (!params.ext || !params.angle || !params.radius || !params.fr || !params.speed || !params.mw) {
                alert('Please select all parameters!');
                return;
            }

            // Create lookup key
            const key = `${params.ext}_${params.angle}_${params.radius}_${params.fr}_${params.speed}_${params.mw}`;
            
            // Get video data
            const videoData = videoMap[key];
            
            if (!videoData) {
                alert('Combination not found! Please try different parameters.');
                return;
            }

            // Update UI
            const resultArea = document.getElementById('resultArea');
            const videoPlayer = document.getElementById('simVideo');
            const descText = document.getElementById('simText');

            resultArea.classList.remove('hidden');
            
            // Set Video
            videoPlayer.src = videoData.path;
            videoPlayer.load();
            
            // Set Text
            descText.innerHTML = videoData.desc;
            
            // Scroll to results
            resultArea.scrollIntoView({ behavior: 'smooth' });
        });
    </script>
</body>
</html>
